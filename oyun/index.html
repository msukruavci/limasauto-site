<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LimasAuto — Bakımdayız</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #bfe2d0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1d2b3a; }
  .card { margin: 16px; max-width: 420px; padding: 32px 28px; background: #fff; border-radius: 28px;
    box-shadow: 0 8px 0 #9cc8b2, 0 18px 40px rgba(0,0,0,.12); text-align: center; }
  .icon { font-size: 56px; line-height: 1; }
  h1 { margin: 16px 0 8px; font-size: 26px; }
  p { margin: 6px 0; font-size: 16px; line-height: 1.5; color: #4a5a6a; }
  .en { margin-top: 18px; padding-top: 14px; border-top: 2px dashed #e3ece7; font-size: 14px; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">🛠️</div>
    <h1>Bakımdayız</h1>
    <p>LimasAuto büyük bir güncelleme için kısa bir süre kapalı.</p>
    <p>Kayıtların güvende; çok yakında yeniden açılıyoruz.</p>
    <p class="en">We're down for maintenance while we prepare a big update. Your saves are safe — back soon.</p>
  </main>
</body>
</html>
